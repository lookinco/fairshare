<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="manifest.webmanifest" />
<title>FairShare</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f2430; --line:#2a3040;
    --ink:#eef1f6; --muted:#8b93a7; --accent:#4ade80; --accent-ink:#04170c;
    --warn:#f59e0b; --neg:#fb7185; --pos:#4ade80;
    --r:16px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  header { padding:22px 20px 8px; }
  header h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .wrap { padding:8px 16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .name { display:flex; align-items:center; gap:10px; }
  .dot { width:30px; height:30px; border-radius:50%; background:var(--panel2); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--muted); }
  .w { font-size:11px; color:var(--muted); }
  .amt { font-variant-numeric:tabular-nums; font-weight:700; }
  .pos { color:var(--pos); } .neg { color:var(--neg); }
  .muted { color:var(--muted); }
  .settle { font-size:14px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .settle:last-child { border-bottom:0; }
  .cur-tag { font-size:11px; color:var(--muted); background:var(--panel2); padding:2px 7px; border-radius:999px; margin-left:6px; }
  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex; gap:10px; z-index:20; }
  button { font:inherit; cursor:pointer; border:0; border-radius:999px; }
  .primary { background:var(--accent); color:var(--accent-ink); font-weight:800; padding:15px 26px; box-shadow:0 8px 24px rgba(74,222,128,.25); }
  .ghost { background:var(--panel2); color:var(--ink); font-weight:700; padding:15px 20px; border:1px solid var(--line); }
  dialog { border:0; border-radius:20px 20px 0 0; background:var(--panel); color:var(--ink); width:100%; max-width:520px; padding:20px; position:fixed; bottom:0; top:auto; margin:0 auto; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; text-transform:uppercase; letter-spacing:.05em; }
  input, select { width:100%; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font:inherit; }
  .split-row { display:flex; gap:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip { padding:8px 12px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); font-size:14px; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
  .dlg-actions { display:flex; gap:10px; margin-top:18px; }
  .dlg-actions button { flex:1; padding:14px; }
  .receipt-line { display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px solid var(--line); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .empty { color:var(--muted); text-align:center; padding:18px 0; font-size:14px; }
  #loading { display:none; position:fixed; inset:0; z-index:60; background:rgba(10,12,16,.72);
    backdrop-filter:blur(3px); flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  #loading .lmsg { color:var(--ink); font-weight:600; }
  .spinner { width:44px; height:44px; border-radius:50%; border:4px solid var(--line);
    border-top-color:var(--accent); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>FairShare</h1>
  <p id="groupline">The Ng Trip · tally mode</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>Who's up / down</h2>
    <div id="balances"></div>
  </div>

  <div class="card">
    <h2>Settle up (fewest transfers)</h2>
    <div id="settle"></div>
  </div>

  <div class="card">
    <h2>Recent</h2>
    <div id="feed"></div>
  </div>

  <div class="card">
    <h2>People &amp; weights</h2>
    <div id="people"></div>
    <div class="hint">Adult 1.0 · kid 0.5 · toddler 0.0 — splits divide by weight, not headcount.</div>
  </div>
</div>

<div class="fab">
  <button class="ghost" id="snap">📷 Photo</button>
  <button class="ghost" id="upload">🖼 Upload</button>
  <button class="primary" id="ipaid">＋ I paid</button>
</div>

<!-- camera capture (rear cam) vs library/file picker: two inputs, same handler -->
<input type="file" id="camera" accept="image/*" capture="environment" hidden />
<input type="file" id="picker" accept="image/*" hidden />

<!-- I-paid sheet -->
<dialog id="paidDlg">
  <h2 style="margin-top:0">I paid for the group</h2>
  <label>Amount</label>
  <div class="split-row">
    <input id="amt" type="number" inputmode="decimal" placeholder="0.00" />
    <select id="cur" style="max-width:120px"></select>
  </div>
  <label>Paid by</label>
  <select id="payer"></select>
  <label>Split between</label>
  <div class="chips" id="sharers"></div>
  <div class="dlg-actions">
    <button class="ghost" onclick="paidDlg.close()">Cancel</button>
    <button class="primary" id="savePaid">Save</button>
  </div>
</dialog>

<!-- receipt review sheet -->
<dialog id="receiptDlg">
  <h2 style="margin-top:0">Receipt <span id="rMerchant" class="muted"></span></h2>
  <div id="rLines"></div>
  <label>Tip (add on top)</label>
  <div class="split-row" style="align-items:center">
    <input id="rTip" type="number" inputmode="decimal" placeholder="0.00" style="max-width:130px" />
    <div class="chips" id="tipQuick" style="margin:0"></div>
  </div>
  <div class="receipt-line" style="border:0; margin-top:10px"><b>Total</b><b id="rTotal"></b></div>
  <label>Currency</label>
  <select id="rCur"></select>
  <label>Paid by</label>
  <select id="rPayer"></select>
  <div class="dlg-actions">
    <button class="ghost" onclick="receiptDlg.close()">Cancel</button>
    <button class="primary" id="saveReceipt">Add as expense</button>
  </div>
  <div class="hint" id="rHint"></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
