# fairshare2.sweethomevacation.com — FairShare v2 (Next.js + Supabase).
# v1 stays live on fairshare.sweethomevacation.com (:8792). v2 = :8793.
# Chain: phone → (Cloudflare DNS-only) → this origin → fairshare-v2.service (127.0.0.1:8793).
# HTTP-only to start; certbot --nginx upgrades this to 443 + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name fairshare2.sweethomevacation.com;

    # Let's Encrypt HTTP-01 challenge on the filesystem so renewals keep working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sweethomevacation.com;
    }

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;   # receipt photos
    }
}
