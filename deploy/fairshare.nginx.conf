# fairshare.sweethomevacation.com — FairShare bill-splitter.
# Chain: phone → (Cloudflare DNS-only) → this origin → fairshare.service (127.0.0.1:8792).
# HTTP-only to start; certbot --nginx upgrades this to 443 + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name fairshare.sweethomevacation.com;

    # Let's Encrypt HTTP-01 challenge on the filesystem so renewals keep working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sweethomevacation.com;
    }

    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;   # receipt photos
    }
}
